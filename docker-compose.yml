# /mnt/storage/docker/ufestival/docker-compose.yml
#
# Stack: statische frontend (nginx) + Admin CMS (nginx) + Node.js API
# Code staat op de NAS-locatie zodat je 'm via Samba kunt zien/bewerken.
# Publiek bereikbaar via Cloudflare Tunnel -> NPM -> deze containers.

services:
  # ------------------------------------------------------------------
  # FRONTEND - kale nginx die de statische bestanden serveert.
  # Code is een read-only bind mount: pas een bestand aan op de NAS
  # en het is direct live (geen rebuild, geen herstart nodig).
  # ------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: ufestival_frontend
    restart: unless-stopped
    volumes:
      - /mnt/storage/nas/ufestival/frontend:/usr/share/nginx/html:ro
    networks:
      - proxy

  # ------------------------------------------------------------------
  # ADMIN CMS - nginx met React Router support + API-proxy.
  # Bouw lokaal met: cd admin && npm run build
  # Kopieer admin/dist/* naar /mnt/storage/nas/ufestival/admin/
  # Kopieer admin/nginx.conf naar /mnt/storage/nas/ufestival/admin-nginx.conf
  # ------------------------------------------------------------------
  admin:
    image: nginx:alpine
    container_name: ufestival_admin
    restart: unless-stopped
    volumes:
      - /mnt/storage/nas/ufestival/admin:/usr/share/nginx/html:ro
      - /mnt/storage/nas/ufestival/admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    depends_on:
      - api

  # ------------------------------------------------------------------
  # API - Node.js, dev-stijl. Code is een bind mount; nodemon herstart
  # de server automatisch bij wijzigingen. node_modules zit in een
  # named volume zodat host-rommel de container-install niet overschrijft.
  # ------------------------------------------------------------------
  api:
    image: node:22-alpine
    container_name: ufestival_api
    restart: unless-stopped
    working_dir: /app
    # npm install draait alleen als node_modules nog leeg is, daarna
    # start nodemon. Zo hoef je niet handmatig te installeren.
    command: sh -c "[ -d node_modules/.bin ] || npm install && npx nodemon server.js"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - /mnt/storage/nas/ufestival/api:/app
      - ufestival_api_node_modules:/app/node_modules
    networks:
      - proxy
      - database

networks:
  proxy:
    external: true
  database:
    external: true

volumes:
  ufestival_api_node_modules:
