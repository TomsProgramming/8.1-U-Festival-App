<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="U Festival">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1A1A22"/>
      <stop offset="55%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="50%">
      <stop offset="0%" stop-color="#F03228" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F03228" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- Brand mark: vermilion heart over a white U -->
  <g transform="translate(106 120)">
    <!-- Heart -->
    <path
      d="M150 60
         C 130 18, 56 18, 56 84
         C 56 148, 150 192, 150 192
         C 150 192, 244 148, 244 84
         C 244 18, 170 18, 150 60 Z"
      fill="#F03228"/>
    <!-- U (white) -->
    <path
      d="M56 152
         L56 248
         C 56 296, 96 312, 150 312
         C 204 312, 244 296, 244 248
         L244 152"
      stroke="#FFFFFF" stroke-width="36" fill="none" stroke-linecap="square"/>
  </g>
</svg>
